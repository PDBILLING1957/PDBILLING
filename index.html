<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PD Billing — Indian Products International Marketing</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241f1a;
    --paper:#f9f4e8;
    --paper-line:#e8dcc0;
    --forest:#122922;
    --forest-2:#1a3a30;
    --brass:#b4863a;
    --brass-light:#d9ad63;
    --rust:#9c4a2e;
    --ok:#3f6e4f;
    --warn:#b4863a;
    --bad:#9c4a2e;
    --paid-bg:#e7efe6;
    --unpaid-bg:#f6e8e1;
    --partial-bg:#f8f1de;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--forest); color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Fraunces',serif; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  /* ---- shell ---- */
  #app{ display:flex; min-height:100vh; }
  #sidebar{
    width:220px; flex-shrink:0; background:var(--forest);
    background-image: radial-gradient(circle at 20px 20px, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 18px 18px;
    color:#eae3d2; padding:22px 14px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; padding:0 6px;}
  #sidebar .brand .tack{ width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 65%, #7a5c22 100%); box-shadow:0 1px 2px rgba(0,0,0,.4);}
  #sidebar .brand-text{ line-height:1.15; }
  #sidebar .brand-text .name{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; color:#f4ead0;}
  #sidebar .brand-text .sub{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:#9db3a6;}
  .navgroup{ margin-bottom:18px; }
  .navgroup .label{ font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:#77897d; padding:0 10px 6px; }
  .navitem{
    display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:7px; font-size:13.5px;
    color:#d9d2bd; cursor:pointer; margin-bottom:2px; transition:background .12s;
  }
  .navitem:hover{ background:rgba(255,255,255,.06); }
  .navitem.active{ background:rgba(180,134,58,.22); color:#f4ead0; font-weight:600; }
  .navitem .dot{ width:5px; height:5px; border-radius:50%; background:var(--brass-light); flex-shrink:0; }
  #sidebar .userbox{ margin-top:20px; padding:10px; border:1px dashed rgba(234,227,210,.25); border-radius:8px; font-size:12px; color:#c9c1a9;}
  #sidebar .userbox b{ color:#f4ead0; }
  #sidebar .logout{ margin-top:8px; font-size:11.5px; color:#d9ad63; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

  #main{
    flex:1; background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 78px;
    min-height:100vh; padding:26px 34px 60px;
  }
  .topbar{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:22px; padding-bottom:14px; border-bottom:2px solid var(--ink);}
  .topbar h1{ font-size:26px; margin:0; font-weight:600; }
  .topbar .stamp{ font-size:11px; color:#8a7f68; text-transform:uppercase; letter-spacing:.08em;}

  .card{
    background:#fffdf6; border:1px solid var(--paper-line); border-radius:10px; padding:18px 20px;
    box-shadow:0 1px 0 rgba(36,31,26,.03);
    position:relative;
  }
  .card::before, .card::after{
    content:''; position:absolute; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--brass-light), var(--brass) 65%, #7a5c22 100%);
    top:8px;
  }
  .card::before{ left:8px; } .card::after{ right:8px; }

  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:26px;}
  .kpi{ padding:16px 18px 14px; }
  .kpi .label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#8a7f68; margin-bottom:6px;}
  .kpi .value{ font-family:'Fraunces',serif; font-size:26px; font-weight:600; }
  .kpi .value.bad{ color:var(--bad); } .kpi .value.ok{ color:var(--ok); } .kpi .value.warn{ color:var(--warn);}

  table.ledger{ width:100%; border-collapse:collapse; font-size:13px; }
  table.ledger thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:#8a7f68;
    border-bottom:1.5px solid var(--ink); padding:6px 10px; white-space:nowrap;
  }
  table.ledger tbody td{ padding:8px 10px; border-bottom:1px dashed var(--paper-line); vertical-align:middle;}
  table.ledger tbody tr:hover{ background:rgba(180,134,58,.06); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .pill.paid{ background:var(--paid-bg); color:var(--ok); }
  .pill.unpaid{ background:var(--unpaid-bg); color:var(--bad); }
  .pill.partial{ background:var(--partial-bg); color:var(--warn); }
  .pill.low{ background:var(--unpaid-bg); color:var(--bad); }
  .pill.ok2{ background:var(--paid-bg); color:var(--ok); }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600; cursor:pointer; border:1px solid transparent; }
  .btn-brass{ background:var(--brass); color:#fff; } .btn-brass:hover{ background:#9d7230; }
  .btn-ghost{ background:transparent; border-color:var(--ink); color:var(--ink); }
  .btn-ghost:hover{ background:rgba(36,31,26,.06); }
  .btn-sm{ padding:4px 9px; font-size:11.5px; }
  .btn-danger{ background:transparent; color:var(--bad); border-color:var(--bad); }

  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:#8a7f68; margin-bottom:4px;}
  .field input, .field select, .field textarea{
    width:100%; padding:8px 10px; border:1px solid #cfc4a4; border-radius:6px; font-size:13.5px; font-family:inherit;
    background:#fff;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--brass-light); outline-offset:1px; border-color:var(--brass); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(18,41,34,.55); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; z-index:50; overflow-y:auto;}
  .modal{ background:#fffdf6; border-radius:12px; width:100%; max-width:640px; padding:22px 24px; border:1px solid var(--paper-line); box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .modal h3{ margin:0 0 16px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
  .stitch{ border-top:1px dashed var(--paper-line); margin:16px 0; }

  .tag-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{ width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15); vertical-align:-2px; margin-right:6px;}

  /* login */
  #loginwrap{ min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; background:var(--forest);
    background-image: radial-gradient(circle at 20px 20px, rgba(255,255,255,0.035) 1px, transparent 1px); background-size:18px 18px;}
  .login-card{ background:#fffdf6; border-radius:14px; padding:38px 36px; width:100%; max-width:420px; box-shadow:0 30px 80px rgba(0,0,0,.45);}
  .staff-tile{ display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--paper-line); border-radius:9px; cursor:pointer; margin-bottom:9px; transition:.12s;}
  .staff-tile:hover{ border-color:var(--brass); background:rgba(180,134,58,.06); }
  .staff-avatar{ width:36px;height:36px;border-radius:50%; background:var(--forest-2); color:#f4ead0; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Fraunces',serif; flex-shrink:0;}
  .pin-dots{ display:flex; gap:10px; justify-content:center; margin:18px 0; }
  .pin-dots .d{ width:14px; height:14px; border-radius:50%; border:1.5px solid var(--ink); }
  .pin-dots .d.filled{ background:var(--ink); }
  .keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .keypad button{ padding:14px 0; font-size:17px; border-radius:9px; border:1px solid var(--paper-line); background:#fff; cursor:pointer; font-family:'Fraunces',serif;}
  .keypad button:active{ background:var(--paper-line); }

  .empty{ text-align:center; padding:50px 20px; color:#8a7f68; }
  .empty .display{ font-size:19px; color:var(--ink); margin-bottom:6px;}

  .doc{ background:#fffdf6; border:1px solid var(--paper-line); border-radius:10px; max-width:720px; margin:0 auto; padding:34px 38px; }
  .doc-head{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px;}
  .doc-head .biz{ font-family:'Fraunces',serif; font-size:20px; font-weight:700;}
  .doc-head .biz-sub{ font-size:11.5px; color:#8a7f68; margin-top:2px; }
  .doc-head .doctitle{ text-align:right; }
  .doc-head .doctitle .t{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:#8a7f68;}
  .doc-head .doctitle .n{ font-family:'JetBrains Mono',monospace; font-size:18px; font-weight:700;}
  .send-row{ display:flex; gap:10px; margin-top:22px; padding-top:16px; border-top:1px dashed var(--paper-line); }
  a.send-btn{ text-decoration:none; padding:9px 16px; border-radius:7px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;}
  a.wa{ background:#e7efe6; color:#256b3a; } a.mail{ background:#e2ebf5; color:#2b5a94;}

  @media print{
    #sidebar,.topbar,.no-print{ display:none !important; }
    #main{ padding:0; background:none; }
    body{ background:#fff; }
  }
  @media (max-width:820px){
    #sidebar{ position:fixed; left:-240px; z-index:40; transition:left .18s; box-shadow:8px 0 30px rgba(0,0,0,.3);}
    #sidebar.open{ left:0; }
    #main{ padding:18px 16px 50px; }
    .grid2{ grid-template-columns:1fr; }
    #menu-toggle{ display:inline-flex !important; }
    .topbar{ flex-direction:column; align-items:flex-start; gap:4px; }
    .topbar .stamp{ font-size:9.5px; }
    .kpi-grid{ grid-template-columns:1fr 1fr; }
  }
  #menu-toggle{ display:none; }
  .scrollx{ overflow-x:auto; }

  @media (max-width:820px){
    #mobile-menu-close{
      display:flex;
      position:absolute;
      right:10px;
      top:10px;
      width:34px;
      height:34px;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(234,227,210,.25);
      border-radius:7px;
      background:transparent;
      color:#f4ead0;
      font-size:24px;
      cursor:pointer;
      z-index:41;
    }
  }
  #mobile-menu-close{ display:none; }

</style>
</head>
<body>
<div id="loginwrap"></div>
<div id="app" style="display:none;">
  <div id="sidebar"><button id="mobile-menu-close" aria-label="Close menu" onclick="closeMobileMenu()">×</button></div>
  <div id="main"></div>
</div>

<script>
window.STORAGE_OK = !!(window.storage && window.storage.get);

/* =========================================================
   PD BILLING — data model + business logic
   Mirrors: 07082026_Invoice_Inventory_Payment_System_v10.xlsx
   ========================================================= */

const BIZ = {
  name: "PD Indian Products International Marketing",
  addr: "Shop 14, Rasid Compound, Malad West, Mumbai 400064",
  phone: "919820012345",
  email: "pdindianproducts@gmail.com",
  gstin: "27ABCPD1234F1Z5",
};

const seedStaff = [
  { id:"u1", name:"Owner", pin:"0000", role:"Owner" },
  { id:"u2", name:"Hemant Desai", pin:"1234", role:"Sales" },
];

function seedDB(){
  return {
    seq: { cust:2, supp:2, item:6, invoice:1000, po:1000, pay:0, spay:0 },
    customers: [
      { id:"C001", name:"Sharma Interiors", phone:"919833011122", email:"sharma.interiors@example.com", address:"Andheri West, Mumbai", gstin:"27AASPS1111Q1Z0", openingBalance:2850, asOf:"2026-04-01" },
      { id:"C002", name:"Mehta Furnishings", phone:"919833022233", email:"mehtafurnishings@example.com", address:"Borivali, Mumbai", gstin:"", openingBalance:0, asOf:"2026-04-01" },
    ],
    suppliers: [
      { id:"S001", name:"Om Sai Foam Works", phone:"919920011122", email:"omsaifoam@example.com", address:"Vasai, Palghar", gstin:"27AASPS2222Q1Z0", openingBalance:820, asOf:"2026-04-01" },
      { id:"S002", name:"Gujarat Fabric Mills", phone:"919920033344", email:"gujaratfabric@example.com", address:"Surat, Gujarat", gstin:"", openingBalance:0, asOf:"2026-04-01" },
    ],
    items: [
      { id:"ITM001", name:"Sofa Set 3+2 Seater", category:"Sofas", unitCost:18000, unitPrice:25999, opening:6, reorder:3, swatch:"#7a5c22" },
      { id:"ITM002", name:"Recliner Chair (Single)", category:"Sofas", unitCost:9500, unitPrice:14999, opening:8, reorder:3, swatch:"#9c4a2e" },
      { id:"ITM003", name:"Curtain Fabric (per meter)", category:"Curtains", unitCost:180, unitPrice:320, opening:120, reorder:30, swatch:"#3f6e4f" },
      { id:"ITM004", name:"Cushion Cover Set (5pc)", category:"Accessories", unitCost:250, unitPrice:499, opening:40, reorder:10, swatch:"#b4863a" },
      { id:"ITM005", name:"Dining Table Set 6-Seater", category:"Tables", unitCost:22000, unitPrice:32999, opening:3, reorder:2, swatch:"#4a4238" },
      { id:"ITM006", name:"Bed Headboard Cushion Panel", category:"Accessories", unitCost:3200, unitPrice:5499, opening:5, reorder:2, swatch:"#5c3a5c" },
    ],
    invoices: [],      // {no, date, custId, taxPct, dueDate}
    salesLog: [],       // {invoiceNo, itemId, qty, price}
    purchases: [],      // {no, date, suppId, taxPct, dueDate}
    purchaseLog: [],    // {poNo, itemId, qty, cost}
    payments: [],        // {id, date, invoiceNo, amount, mode}
    supplierPayments: [], // {id, date, poNo, amount, mode}
  };
}

let DB = null;
let STAFF = null;
let CURRENT_USER = null;
let VIEW = "dashboard";
let PIN_BUFFER = "";
let SELECTED_STAFF = null;

async function loadAll(){
  if (window.STORAGE_OK){
    try {
      const s = await window.storage.get("pdbilling-staff-v1", true);
      STAFF = JSON.parse(s.value);
    } catch(e){ STAFF = seedStaff; await window.storage.set("pdbilling-staff-v1", JSON.stringify(STAFF), true).catch(()=>{}); }
    try {
      const d = await window.storage.get("pdbilling-data-v1", true);
      DB = JSON.parse(d.value);
    } catch(e){ DB = seedDB(); await window.storage.set("pdbilling-data-v1", JSON.stringify(DB), true).catch(()=>{}); }
  } else {
    STAFF = seedStaff;
    DB = seedDB();
  }
}

async function saveDB(){
  if (window.STORAGE_OK){
    try { await window.storage.set("pdbilling-data-v1", JSON.stringify(DB), true); }
    catch(e){ console.error("save failed", e); }
  }
}

/* ---------- derived calculations (mirrors the workbook formulas) ---------- */

function invoiceLines(no){ return DB.salesLog.filter(l=>l.invoiceNo===no); }
function poLines(no){ return DB.purchaseLog.filter(l=>l.poNo===no); }

function invoiceSubtotal(no){ return invoiceLines(no).reduce((s,l)=>s+l.qty*l.price,0); }
function invoiceTax(inv){ return round2(invoiceSubtotal(inv.no) * (inv.taxPct/100)); }
function invoiceTotal(inv){ return invoiceSubtotal(inv.no) + invoiceTax(inv); }
function invoicePaid(no){ return DB.payments.filter(p=>p.invoiceNo===no).reduce((s,p)=>s+p.amount,0); }
function invoiceBalance(inv){ return round2(invoiceTotal(inv) - invoicePaid(inv.no)); }
function invoiceStatus(inv){
  const bal = invoiceBalance(inv), paid = invoicePaid(inv.no);
  if (bal<=0.005) return "Paid";
  if (paid===0) return "Unpaid";
  return "Partial";
}

function poSubtotal(no){ return poLines(no).reduce((s,l)=>s+l.qty*l.cost,0); }
function poTax(po){ return round2(poSubtotal(po.no) * (po.taxPct/100)); }
function poTotal(po){ return poSubtotal(po.no) + poTax(po); }
function poPaid(no){ return DB.supplierPayments.filter(p=>p.poNo===no).reduce((s,p)=>s+p.amount,0); }
function poBalance(po){ return round2(poTotal(po) - poPaid(po.no)); }
function poStatus(po){
  const bal = poBalance(po), paid = poPaid(po.no);
  if (bal<=0.005) return "Paid";
  if (paid===0) return "Unpaid";
  return "Partial";
}

function stockOf(itemId){
  const item = DB.items.find(i=>i.id===itemId);
  if (!item) return 0;
  const purchased = DB.purchaseLog.filter(l=>l.itemId===itemId).reduce((s,l)=>s+l.qty,0);
  const sold = DB.salesLog.filter(l=>l.itemId===itemId).reduce((s,l)=>s+l.qty,0);
  return item.opening + purchased - sold;
}

function customerOutstanding(custId){
  const cust = DB.customers.find(c=>c.id===custId);
  const opening = cust ? cust.openingBalance : 0;
  const fromInvoices = DB.invoices.filter(i=>i.custId===custId).reduce((s,i)=>s+Math.max(0,invoiceBalance(i)),0);
  return round2(opening + fromInvoices);
}
function supplierPayable(suppId){
  const supp = DB.suppliers.find(s=>s.id===suppId);
  const opening = supp ? supp.openingBalance : 0;
  const fromPOs = DB.purchases.filter(p=>p.suppId===suppId).reduce((s,p)=>s+Math.max(0,poBalance(p)),0);
  return round2(opening + fromPOs);
}

function round2(n){ return Math.round((n+Number.EPSILON)*100)/100; }
function fmt(n){ return "₹" + (Math.round((n||0)*100)/100).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }

function nextInvoiceNo(){ DB.seq.invoice+=1; return "INV-"+DB.seq.invoice; }
function nextPONo(){ DB.seq.po+=1; return "PO-"+DB.seq.po; }
function nextCustId(){ DB.seq.cust+=1; return "C"+String(DB.seq.cust).padStart(3,"0"); }
function nextSuppId(){ DB.seq.supp+=1; return "S"+String(DB.seq.supp).padStart(3,"0"); }
function nextItemId(){ DB.seq.item+=1; return "ITM"+String(DB.seq.item).padStart(3,"0"); }
function nextPayId(){ DB.seq.pay+=1; return "PMT-"+DB.seq.pay; }
function nextSPayId(){ DB.seq.spay+=1; return "SPMT-"+DB.seq.spay; }

/* =========================================================
   LOGIN
   ========================================================= */

function renderLogin(){
  const wrap = document.getElementById("loginwrap");
  if (!SELECTED_STAFF){
    wrap.innerHTML = `
      <div class="login-card">
        <div style="text-align:center;margin-bottom:22px;">
          <div class="display" style="font-size:22px;font-weight:700;">PD Billing</div>
          <div style="font-size:12px;color:#8a7f68;letter-spacing:.05em;text-transform:uppercase;margin-top:4px;">Indian Products International Marketing · Mumbai</div>
        </div>
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#8a7f68;margin-bottom:10px;">Who is using the app?</div>
        ${STAFF.map(s=>`
          <div class="staff-tile" onclick="pickStaff('${s.id}')">
            <div class="staff-avatar">${s.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</div>
            <div>
              <div style="font-weight:600;">${s.name}</div>
              <div style="font-size:11.5px;color:#8a7f68;">${s.role}</div>
            </div>
          </div>
        `).join("")}
      </div>`;
    return;
  }
  const staff = STAFF.find(s=>s.id===SELECTED_STAFF);
  wrap.innerHTML = `
    <div class="login-card" style="text-align:center;">
      <div class="staff-avatar" style="margin:0 auto 10px;width:52px;height:52px;font-size:18px;">${staff.name.split(" ").map(w=>w[0]).slice(0,2).join("")}</div>
      <div style="font-weight:600;font-size:16px;">${staff.name}</div>
      <div style="font-size:11.5px;color:#8a7f68;margin-bottom:6px;">Enter PIN</div>
      <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="d ${i<PIN_BUFFER.length?'filled':''}"></div>`).join("")}</div>
      <div id="pinerr" style="color:var(--bad);font-size:12px;height:16px;margin-bottom:6px;"></div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="pinPress('${n}')">${n}</button>`).join("")}
        <button onclick="pinBack('staff')" style="color:#8a7f68;font-size:13px;">Back</button>
        <button onclick="pinPress('0')">0</button>
        <button onclick="pinBack('del')" style="color:#8a7f68;font-size:13px;">⌫</button>
      </div>
    </div>`;
}
function pickStaff(id){ SELECTED_STAFF=id; PIN_BUFFER=""; renderLogin(); }
function pinBack(kind){
  if (kind==='staff'){ SELECTED_STAFF=null; PIN_BUFFER=""; renderLogin(); return; }
  PIN_BUFFER = PIN_BUFFER.slice(0,-1); renderLogin();
}
function pinPress(d){
  if (PIN_BUFFER.length>=4) return;
  PIN_BUFFER += d;
  renderLogin();
  if (PIN_BUFFER.length===4){
    const staff = STAFF.find(s=>s.id===SELECTED_STAFF);
    if (staff.pin===PIN_BUFFER){
      CURRENT_USER = staff;
      boot();
    } else {
      setTimeout(()=>{
        document.getElementById("pinerr").textContent = "Incorrect PIN — try again";
        PIN_BUFFER=""; renderLogin();
      }, 220);
    }
  }
}
function logout(){ CURRENT_USER=null; SELECTED_STAFF=null; PIN_BUFFER=""; document.getElementById("app").style.display="none"; document.getElementById("loginwrap").style.display="flex"; renderLogin(); }

}

function markActive(id){
  document.querySelectorAll(".navitem").forEach(el=>el.classList.toggle("active", el.dataset.nav===id));
}

function go(id){
  closeMobileMenu();
  VIEW = id;
  markActive(id);
  const main = document.getElementById("main");
  main.innerHTML = renderView(id);
  window.scrollTo(0,0);
}


function closeMobileMenu(){
  const sb = document.getElementById("sidebar");
  if (sb) sb.classList.remove("open");
}
function toggleMobileMenu(){
  const sb = document.getElementById("sidebar");
  if (sb) sb.classList.toggle("open");
}
document.addEventListener("click", function(e){
  const sb = document.getElementById("sidebar");
  const toggle = document.getElementById("menu-toggle");
  if (!sb || !sb.classList.contains("open")) return;
  if (e.target === sb || sb.contains(e.target) || (toggle && toggle.contains(e.target))) return;
  closeMobileMenu();
});

function renderView(id){
  const titles = Object.fromEntries(NAV.flatMap(g=>g.items));
  const header = `<div class="topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span id="menu-toggle" class="no-print" style="cursor:pointer;font-size:20px;" onclick="toggleMobileMenu()">☰</span>
      <h1>${titles[id]||id}</h1>
    </div>
    <div class="stamp">${BIZ.name}</div>
  </div>`;
  let body = "";
  if (id==="dashboard") body = viewDashboard();
  else if (id==="customers") body = viewParties("customers");
  else if (id==="suppliers") body = viewParties("suppliers");
  else if (id==="inventory") body = viewInventory();
  else if (id==="invoices") body = viewInvoiceRegister();
  else if (id==="sales-log") body = viewSalesLog();
  else if (id==="payments") body = viewPayments("payments");
  else if (id==="purchases") body = viewPurchaseRegister();
  else if (id==="purchase-log") body = viewPurchaseLog();
  else if (id==="supplier-payments") body = viewPayments("supplier-payments");
  else if (id==="doc-invoice") body = viewDoc("invoice");
  else if (id==="doc-po") body = viewDoc("po");
  else if (id==="doc-receipt") body = viewDoc("receipt");
  else if (id==="doc-outstanding") body = viewDoc("outstanding");
  else if (id==="doc-supp-outstanding") body = viewDoc("supp-outstanding");
  else if (id==="report-sales") body = viewReportSales();
  else if (id==="report-purchase") body = viewReportPurchase();
  else if (id==="report-aging") body = viewReportAging();
  return header + body;
}

/* =========================================================
   DASHBOARD
   ========================================================= */

function viewDashboard(){
  const totalInvoices = DB.invoices.length;
  const totalSales = DB.invoices.reduce((s,i)=>s+invoiceTotal(i),0);
  const totalReceived = DB.payments.reduce((s,p)=>s+p.amount,0);
  const totalOutstanding = DB.customers.reduce((s,c)=>s+customerOutstanding(c.id),0);
  const overdue = DB.invoices.filter(i=>invoiceBalance(i)>0.005 && i.dueDate && i.dueDate<todayISO()).length;
  const lowStock = DB.items.filter(it=>stockOf(it.id)<=it.reorder).length;
  const totalPurchases = DB.purchases.reduce((s,p)=>s+poTotal(p),0);
  const totalPayable = DB.suppliers.reduce((s,su)=>s+supplierPayable(su.id),0);
  const invAtCost = DB.items.reduce((s,it)=>s+stockOf(it.id)*it.unitCost,0);
  const invAtRetail = DB.items.reduce((s,it)=>s+stockOf(it.id)*it.unitPrice,0);

  const kpi = (label,val,cls="") => `<div class="card kpi"><div class="label">${label}</div><div class="value ${cls}">${val}</div></div>`;

  return `
    <div class="kpi-grid">
      ${kpi("Total Invoices", totalInvoices)}
      ${kpi("Total Sales (incl. tax)", fmt(totalSales))}
      ${kpi("Total Received", fmt(totalReceived), "ok")}
      ${kpi("Total Outstanding (customers)", fmt(totalOutstanding), totalOutstanding>0?"bad":"")}
      ${kpi("Overdue Invoices", overdue, overdue>0?"bad":"ok")}
      ${kpi("Items to Reorder", lowStock, lowStock>0?"warn":"ok")}
      ${kpi("Total Purchases (incl. tax)", fmt(totalPurchases))}
      ${kpi("Total Payable (to suppliers)", fmt(totalPayable), totalPayable>0?"warn":"")}
      ${kpi("Inventory Value (at cost)", fmt(invAtCost))}
      ${kpi("Inventory Value (at retail)", fmt(invAtRetail))}
    </div>
    <div class="card" style="font-size:12.5px;color:#8a7f68;">Tip: open <b>Inventory</b> and sort by Stock Status to see everything at or below its reorder level.</div>
  `;
}

async function saveParty(kind, id){
  const isCust = kind==="customers";
  const list = isCust ? DB.customers : DB.suppliers;
  const data = {
    name: val("f-name"), phone: val("f-phone"), email: val("f-email"),
    gstin: val("f-gstin"), address: val("f-address"),
    openingBalance: parseFloat(val("f-ob"))||0, asOf: val("f-asof"),
  };
  if (!data.name){ alert("Name is required."); return; }
  if (id){ Object.assign(list.find(x=>x.id===id), data); }
  else { data.id = isCust? nextCustId() : nextSuppId(); list.push(data); }
  await saveDB(); closeModal(); go(VIEW);
}
async function deleteParty(kind, id){
  if (!confirm("Delete this record? This cannot be undone.")) return;
  const isCust = kind==="customers";
  const list = isCust ? DB.customers : DB.suppliers;
  const idx = list.findIndex(x=>x.id===id);
  if (idx>-1) list.splice(idx,1);
  await saveDB(); closeModal(); go(VIEW);
}

function editInvoice(no){

async function saveInvoice(no){
  const data = { date: val("f-date"), custId: val("f-cust"), taxPct: parseFloat(val("f-tax"))||0, dueDate: val("f-due") };
  if (no){ Object.assign(DB.invoices.find(i=>i.no===no), data); }
  else { data.no = nextInvoiceNo(); DB.invoices.push(data); }
  await saveDB(); closeModal(); go(VIEW);
}
async function deleteInvoice(no){
  if (!confirm(`Delete ${no}? Its sales-log lines and payments will also be removed.`)) return;
  DB.invoices = DB.invoices.filter(i=>i.no!==no);
  DB.salesLog = DB.salesLog.filter(l=>l.invoiceNo!==no);
  DB.payments = DB.payments.filter(p=>p.invoiceNo!==no);
  await saveDB(); closeModal(); go(VIEW);
}

function viewSalesLog(){
  const rows = [...DB.salesLog].reverse().map((l,revIdx)=>{
    const idx = DB.salesLog.length-1-revIdx;
    const item = DB.items.find(i=>i.id===l.itemId);
    return `<tr>
      <td class="mono">${l.invoiceNo}</td>
      <td>${item?item.name:'—'}</td>
      <td>${l.qty}</td>
      <td>${fmt(l.price)}</td>
      <td style="font-weight:700;">${fmt(l.qty*l.price)}</td>
      <td class="no-print"><span class="btn btn-sm btn-ghost" onclick="deleteSaleLine(${idx})">Remove</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;" class="no-print">
        <div style="font-size:12px;color:#8a7f68;">One row per item sold. Reduces Inventory stock automatically.</div>
        <span class="btn btn-brass btn-sm" onclick="addSaleLine()">+ Add Line</span>
      </div>
      <div class="scrollx"><table class="ledger"><thead><tr>
        <th>Invoice No</th><th>Item</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th>
      </tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">No sales lines yet.</td></tr>`}</tbody></table></div>
    </div>`;
}
function addSaleLine(){
  if (!DB.invoices.length){ alert("Create an invoice first (Invoice Register)."); return; }
  if (!DB.items.length){ alert("Add an item first (Inventory)."); return; }
  openModal("Add Sales Log Line", `
    <div class="grid2">
      <div class="field"><label>Invoice No</label><select id="f-inv">${DB.invoices.map(i=>`<option value="${i.no}">${i.no}</option>`).join("")}</select></div>
      <div class="field"><label>Item</label><select id="f-item" onchange="fillPrice()">${DB.items.map(i=>`<option value="${i.id}" data-price="${i.unitPrice}">${i.name}</option>`).join("")}</select></div>
      <div class="field"><label>Qty</label><input id="f-qty" type="number" value="1" min="1"></div>
      <div class="field"><label>Unit Price</label><input id="f-price" type="number" value="${DB.items[0]?.unitPrice||0}"></div>
    </div>
    <div style="font-size:11.5px;color:#8a7f68;margin-bottom:14px;">Available stock: <b id="f-stockhint">${stockOf(DB.items[0]?.id)}</b></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <span class="btn btn-ghost" onclick="closeModal()">Cancel</span>
      <span class="btn btn-brass" onclick="saveSaleLine()">Add</span>
    </div>
  `);
  document.getElementById("f-item").addEventListener("change", fillPrice);
}
function fillPrice(){
  const sel = document.getElementById("f-item");
  const opt = sel.options[sel.selectedIndex];
  document.getElementById("f-price").value = opt.dataset.price;
  document.getElementById("f-stockhint").textContent = stockOf(opt.value);
}
async function saveSaleLine(){
  const itemId = val("f-item"), qty = parseFloat(val("f-qty"))||0;
  const avail = stockOf(itemId);
  if (qty>avail && !confirm(`Only ${avail} in stock — record this sale anyway (stock will go negative)?`)) return;
  DB.salesLog.push({ invoiceNo: val("f-inv"), itemId, qty, price: parseFloat(val("f-price"))||0 });
  await saveDB(); closeModal(); go(VIEW);
}
async function deleteSaleLine(idx){
  if (!confirm("Remove this line?")) return;
  DB.salesLog.splice(idx,1);
  await saveDB(); closeModal(); go(VIEW);
}

function viewPayments(kind){
  const isCust = kind==="payments";
  const list = isCust ? DB.payments : DB.supplierPayments;
  const refs = isCust ? DB.invoices.map(i=>i.no) : DB.purchases.map(p=>p.no);
  const refLabel = isCust ? "Invoice No" : "PO No";
  const refKey = isCust ? "invoiceNo" : "poNo";
  const rows = [...list].reverse().map((p,revIdx)=>{
    const idx = list.length-1-revIdx;
    return `<tr>
      <td class="mono">${p.id}</td><td>${p.date}</td><td class="mono">${p[refKey]}</td>
      <td style="font-weight:700;">${fmt(p.amount)}</td><td>${p.mode}</td>
      <td class="no-print"><span class="btn btn-sm btn-ghost" onclick="deletePayment('${kind}',${idx})">Remove</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;" class="no-print">
        <div style="font-size:12px;color:#8a7f68;">Log every ${isCust?'payment received':'payment you make'} against a ${refLabel}. Balances update automatically.</div>
        <span class="btn btn-brass btn-sm" onclick="addPayment('${kind}')">+ Log Payment</span>
      </div>
      <div class="scrollx"><table class="ledger"><thead><tr>
        <th>Payment ID</th><th>Date</th><th>${refLabel}</th><th>Amount</th><th>Mode</th><th></th>
      </tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">No payments logged yet.</td></tr>`}</tbody></table></div>
    </div>
    ${!refs.length?`<div class="card" style="margin-top:12px;font-size:12.5px;color:#8a7f68;">Create ${isCust?'an invoice':'a purchase order'} first.</div>`:""}
  `;
}
function addPayment(kind){
  const isCust = kind==="payments";
  const refs = isCust ? DB.invoices : DB.purchases;
  if (!refs.length){ alert(`Create ${isCust?'an invoice':'a purchase order'} first.`); return; }
  openModal(`Log ${isCust?'Payment Received':'Supplier Payment'}`, `
    <div class="grid2">
      <div class="field"><label>${isCust?'Invoice No':'PO No'}</label><select id="f-ref">${refs.map(r=>`<option value="${r.no}">${r.no} — ${fmt(isCust?invoiceBalance(r):poBalance(r))} due</option>`).join("")}</select></div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${todayISO()}"></div>
      <div class="field"><label>Amount</label><input id="f-amount" type="number" value="0"></div>
      <div class="field"><label>Mode</label><select id="f-mode"><option>UPI</option><option>Bank Transfer</option><option>Cash</option><option>Cheque</option><option>Card</option></select></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <span class="btn btn-ghost" onclick="closeModal()">Cancel</span>
      <span class="btn btn-brass" onclick="savePayment('${kind}')">Save</span>
    </div>
  `);
}
async function savePayment(kind){
  const isCust = kind==="payments";
  const amount = parseFloat(val("f-amount"))||0;
  if (amount<=0){ alert("Enter an amount greater than zero."); return; }
  const rec = { id: isCust?nextPayId():nextSPayId(), date: val("f-date"), amount, mode: val("f-mode") };
  if (isCust){ rec.invoiceNo = val("f-ref"); DB.payments.push(rec); }
  else { rec.poNo = val("f-ref"); DB.supplierPayments.push(rec); }
  await saveDB(); closeModal(); go(VIEW);
}
async function deletePayment(kind, idx){
  if (!confirm("Remove this payment?")) return;
  (kind==="payments"?DB.payments:DB.supplierPayments).splice(idx,1);
  await saveDB(); closeModal(); go(VIEW);
}

function viewPurchaseRegister(){

      <td>${fmt(poSubtotal(po.no))}</td><td>${po.taxPct}%</td><td>${fmt(poTotal(po))}</td>
      <td>${fmt(poPaid(po.no))}</td><td style="font-weight:700;">${fmt(poBalance(po))}</td>
      <td><span class="pill ${status.toLowerCase()}">${status}</span></td>
      <td class="no-print"><span class="btn btn-sm btn-ghost" onclick="editPO('${po.no}')">Edit</span></td>

  }).join("");

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;" class="no-print">
        <div style="font-size:12px;color:#8a7f68;">PO No fills in automatically. Add line items on the Purchase Log.</div>
        <span class="btn btn-brass btn-sm" onclick="editPO(null)">+ New Purchase Order</span>

      </tr></thead><tbody>${rows || `<tr><td colspan="10" class="empty">No purchase orders yet.</td></tr>`}</tbody></table></div>
    </div>`;
}
function editPO(no){
  const po = no ? DB.purchases.find(p=>p.no===no) : { no:null, date:todayISO(), suppId:DB.suppliers[0]?.id||"", taxPct:18, dueDate:todayISO() };
  openModal(`${no?'Edit':'New'} Purchase Order ${no?('· '+no):''}`, `
    <div class="grid2">
      <div class="field"><label>Supplier</label><select id="f-supp">${DB.suppliers.map(s=>`<option value="${s.id}" ${s.id===po.suppId?'selected':''}>${s.name}</option>`).join("")}</select></div>
      <div class="field"><label>Date</label><input id="f-date" type="date" value="${po.date}"></div>
      <div class="field"><label>Tax %</label><input id="f-tax" type="number" value="${po.taxPct}"></div>
      <div class="field"><label>Due Date</label><input id="f-due" type="date" value="${po.dueDate}"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      ${no?`<span class="btn btn-danger" onclick="deletePO('${no}')">Delete</span>`:""}
      <span class="btn btn-ghost" onclick="closeModal()">Cancel</span>
      <span class="btn btn-brass" onclick="savePO('${no||''}')">Save</span>
    </div>
  `);
}
async function savePO(no){
  const data = { date: val("f-date"), suppId: val("f-supp"), taxPct: parseFloat(val("f-tax"))||0, dueDate: val("f-due") };
  if (no){ Object.assign(DB.purchases.find(p=>p.no===no), data); }
  else { data.no = nextPONo(); DB.purchases.push(data); }
  await saveDB(); closeModal(); go(VIEW);
}
async function deletePO(no){
  if (!confirm(`Delete ${no}? Its purchase-log lines and payments will also be removed.`)) return;
  DB.purchases = DB.purchases.filter(p=>p.no!==no);
  DB.purchaseLog = DB.purchaseLog.filter(l=>l.poNo!==no);
  DB.supplierPayments = DB.supplierPayments.filter(p=>p.poNo!==no);
  await saveDB(); closeModal(); go(VIEW);
}

function viewPurchaseLog(){
  const rows = [...DB.purchaseLog].reverse().map((l,revIdx)=>{
    const idx = DB.purchaseLog.length-1-revIdx;
    const item = DB.items.find(i=>i.id===l.itemId);
    return `<tr>
      <td class="mono">${l.poNo}</td><td>${item?item.name:'—'}</td><td>${l.qty}</td>
      <td>${fmt(l.cost)}</td><td style="font-weight:700;">${fmt(l.qty*l.cost)}</td>
      <td class="no-print"><span class="btn btn-sm btn-ghost" onclick="deletePurchaseLine(${idx})">Remove</span></td>
    </tr>`;
  }).join("");
  return `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;" class="no-print">
        <div style="font-size:12px;color:#8a7f68;">One row per item bought. Increases Inventory stock automatically.</div>
        <span class="btn btn-brass btn-sm" onclick="addPurchaseLine()">+ Add Line</span>
      </div>
      <div class="scrollx"><table class="ledger"><thead><tr>
        <th>PO No</th><th>Item</th><th>Qty</th><th>Unit Cost</th><th>Line Total</th><th></th>
      </tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">No purchase lines yet.</td></tr>`}</tbody></table></div>
    </div>`;
}
function addPurchaseLine(){
  if (!DB.purchases.length){ alert("Create a purchase order first."); return; }
  if (!DB.items.length){ alert("Add an item first (Inventory)."); return; }
  openModal("Add Purchase Log Line", `
    <div class="grid2">
      <div class="field"><label>PO No</label><select id="f-po">${DB.purchases.map(p=>`<option value="${p.no}">${p.no}</option>`).join("")}</select></div>
      <div class="field"><label>Item</label><select id="f-item" onchange="fillCost()">${DB.items.map(i=>`<option value="${i.id}" data-cost="${i.unitCost}">${i.name}</option>`).join("")}</select></div>
      <div class="field"><label>Qty</label><input id="f-qty" type="number" value="1" min="1"></div>
      <div class="field"><label>Unit Cost</label><input id="f-cost" type="number" value="${DB.items[0]?.unitCost||0}"></div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;">
      <span class="btn btn-ghost" onclick="closeModal()">Cancel</span>
      <span class="btn btn-brass" onclick="savePurchaseLine()">Add</span>
    </div>
  `);
  document.getElementById("f-item").addEventListener("change", fillCost);
}
function fillCost(){
  const sel = document.getElementById("f-item");
  document.getElementById("f-cost").value = sel.options[sel.selectedIndex].dataset.cost;
}
async function savePurchaseLine(){
  DB.purchaseLog.push({ poNo: val("f-po"), itemId: val("f-item"), qty: parseFloat(val("f-qty"))||0, cost: parseFloat(val("f-cost"))||0 });
  await saveDB(); closeModal(); go(VIEW);
}
async function deletePurchaseLine(idx){
  if (!confirm("Remove this line?")) return;
  DB.purchaseLog.splice(idx,1);
  await saveDB(); closeModal(); go(VIEW);
}

function viewDoc(type){
  const cfg = {
    invoice: { title:"Tax Invoice", pick:"Invoice No", options:DB.invoices.map(i=>i.no) },
    po: { title:"Purchase Order", pick:"PO No", options:DB.purchases.map(p=>p.no) },
    receipt: { title:"Payment Receipt", pick:"Payment ID", options:DB.payments.map(p=>p.id) },
    outstanding: { title:"Outstanding Statement", pick:"Customer", options:DB.customers.map(c=>c.id) },
    "supp-outstanding": { title:"Supplier Outstanding", pick:"Supplier", options:DB.suppliers.map(s=>s.id) },
  }[type];
  const picker = `
    <div class="card no-print" style="margin-bottom:18px;max-width:420px;">
      <div class="field" style="margin-bottom:10px;"><label>${cfg.pick}</label>
        <select id="doc-picker" onchange="renderDocBody('${type}')">
          <option value="">— select —</option>
          ${cfg.options.map(o=>`<option value="${o}">${labelFor(type,o)}</option>`).join("")}
        </select>
      </div>
      <span class="btn btn-ghost btn-sm" onclick="window.print()">Print / Save PDF</span>
    </div>`;
  return picker + `<div id="doc-body"></div>`;
}
function labelFor(type,id){
  if (type==="outstanding"){ const c=DB.customers.find(x=>x.id===id); return c?c.name:id; }
  if (type==="supp-outstanding"){ const s=DB.suppliers.find(x=>x.id===id); return s?s.name:id; }
  return id;
}

function renderDocBody(type){
  const id = document.getElementById("doc-picker").value;
  const el = document.getElementById("doc-body");
  if (!id){ el.innerHTML=""; return; }
  if (type==="invoice") el.innerHTML = docInvoice(id);
  else if (type==="po") el.innerHTML = docPO(id);
  else if (type==="receipt") el.innerHTML = docReceipt(id);
  else if (type==="outstanding") el.innerHTML = docOutstanding(id);
  else if (type==="supp-outstanding") el.innerHTML = docSuppOutstanding(id);
}

function docHead(title, no, dateLabel, date){
  return `<div class="doc-head">

}
function sendRow(name, phone, email, msg){

/* =========================================================
   REPORTS
   ========================================================= */

function viewReportSales(){
  const rows = DB.items.map(it=>{
    const lines = DB.salesLog.filter(l=>l.itemId===it.id);
    const qty = lines.reduce((s,l)=>s+l.qty,0);
    const revenue = lines.reduce((s,l)=>s+l.qty*l.price,0);
    const cost = qty*it.unitCost;
    return { name:it.name, qty, revenue, cost, profit:revenue-cost };
  }).filter(r=>r.qty>0).sort((a,b)=>b.revenue-a.revenue);
  const rowsHtml = rows.map(r=>`<tr><td>${r.name}</td><td>${r.qty}</td><td>${fmt(r.revenue)}</td><td>${fmt(r.cost)}</td><td style="font-weight:700;">${fmt(r.profit)}</td></tr>`).join("");
  return `<div class="card"><div class="scrollx"><table class="ledger"><thead><tr><th>Item</th><th>Qty Sold</th><th>Revenue</th><th>Est. Cost</th><th>Est. Gross Profit</th></tr></thead>
    <tbody>${rowsHtml || `<tr><td colspan="5" class="empty">No sales recorded yet.</td></tr>`}</tbody></table></div></div>`;
}

function viewReportPurchase(){
  const rows = DB.items.map(it=>{
    const lines = DB.purchaseLog.filter(l=>l.itemId===it.id);
    const qty = lines.reduce((s,l)=>s+l.qty,0);
    const cost = lines.reduce((s,l)=>s+l.qty*l.cost,0);
    return { name:it.name, qty, cost };
  }).filter(r=>r.qty>0).sort((a,b)=>b.cost-a.cost);
  const rowsHtml = rows.map(r=>`<tr><td>${r.name}</td><td>${r.qty}</td><td style="font-weight:700;">${fmt(r.cost)}</td></tr>`).join("");
  return `<div class="card"><div class="scrollx"><table class="ledger"><thead><tr><th>Item</th><th>Qty Purchased</th><th>Total Cost</th></tr></thead>
    <tbody>${rowsHtml || `<tr><td colspan="3" class="empty">No purchases recorded yet.</td></tr>`}</tbody></table></div></div>`;
}

function viewReportAging(){
  const custRows = DB.invoices.filter(i=>invoiceBalance(i)>0.005).map(i=>{
    const cust = DB.customers.find(c=>c.id===i.custId);
    const days = i.dueDate ? Math.max(0, daysBetween(i.dueDate, todayISO())) : 0;
    const bucket = days===0?"Current":days<=30?"1–30 days":days<=60?"31–60 days":days<=90?"61–90 days":"90+ days";
    return { ref:i.no, name:cust?cust.name:'—', due:i.dueDate, bal:invoiceBalance(i), days, bucket };
  }).sort((a,b)=>b.days-a.days);
  const suppRows = DB.purchases.filter(p=>poBalance(p)>0.005).map(p=>{
    const supp = DB.suppliers.find(s=>s.id===p.suppId);
    const days = p.dueDate ? Math.max(0, daysBetween(p.dueDate, todayISO())) : 0;
    const bucket = days===0?"Current":days<=30?"1–30 days":days<=60?"31–60 days":days<=90?"61–90 days":"90+ days";
    return { ref:p.no, name:supp?supp.name:'—', due:p.dueDate, bal:poBalance(p), days, bucket };
  }).sort((a,b)=>b.days-a.days);

  const table = (rows, refLabel) => `<div class="scrollx"><table class="ledger"><thead><tr><th>${refLabel}</th><th>Party</th><th>Due Date</th><th>Days Overdue</th><th>Bucket</th><th>Balance</th></tr></thead>
    <tbody>${rows.map(r=>`<tr><td class="mono">${r.ref}</td><td>${r.name}</td><td>${r.due}</td><td>${r.days}</td><td><span class="pill ${r.days>60?'unpaid':r.days>0?'partial':'ok2'}">${r.bucket}</span></td><td style="font-weight:700;">${fmt(r.bal)}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Nothing overdue.</td></tr>`}</tbody></table></div>`;

  return `
    <div class="card" style="margin-bottom:18px;">
      <h3 style="margin-top:0;">Customers owing you</h3>
      ${table(custRows, "Invoice")}
    </div>
    <div class="card">
      <h3 style="margin-top:0;">You owe suppliers</h3>
      ${table(suppRows, "PO")}
    </div>`;
}

/* =========================================================
   MODAL + small DOM helpers
   ========================================================= */

function val(id){ return document.getElementById(id).value; }
function openModal(title, bodyHtml){
  const wrap = document.createElement("div");
  wrap.className = "modal-backdrop";
  wrap.id = "modal-backdrop";
  wrap.innerHTML = `<div class="modal"><h3>${title}</h3>${bodyHtml}</div>`;
  wrap.addEventListener("mousedown", (e)=>{ if(e.target===wrap) closeModal(); });
  document.body.appendChild(wrap);
}
function closeModal(){ const m=document.getElementById("modal-backdrop"); if(m) m.remove(); }
document.addEventListener("keydown", e=>{
  const login = document.getElementById("loginwrap");
  if (login && login.style.display !== "none") {
    if (/^[0-9]$/.test(e.key)) {
      e.preventDefault();
      pinPress(e.key);
      return;
    }
    if (e.key === "Backspace") {
      e.preventDefault();
      pinBack("del");
      return;
    }
  }
  if(e.key==="Escape") closeModal();
});

/* =========================================================
   MOBILE MENU + BOOT
   ========================================================= */

(async function init(){
  await loadAll();
  renderLogin();
})();
</script>
